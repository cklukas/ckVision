#
# The self-hosted ck-git-hosting CI lane (D-113): every push to main builds
# the strict Release configuration with the host's GCC and runs the complete
# CTest suite on the Linux ARM64 CI host. It is a supplementary lane; the
# release gates are the three-host matrix, the sanitizer lanes and the fuzz
# lane (.github/workflows/ci.yml). The sandbox has no network, which the
# build does not need: ckVision has no external dependencies.
#
# The checkout comes from `git archive`, so it has no .git directory; every
# gate that lists repository files falls back to walking the tree. A
# persistent ccache keeps a rebuild after a small change short.
#
# The last step builds the documentation site with ckdocs (D-114), compiled
# from the ck-git-hosting sister project at the same pinned commit the GitHub
# Pages workflow uses, and `pages:` publishes it on this server's Pages once
# every step has passed.
version: 1
on:
  branches: [main]
  tags: [v*]
runs_on: primary
sisters:
  - name: ck-git-hosting
    ref: ad6dc1de73cedef8eb64d53ab607043ae09845ee
cache:
  - name: ccache
    env: [CCACHE_DIR]
jobs:
  - name: linux-release
    steps:
      - name: configure
        script: |
          cmake -S . -B "$TMPDIR/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCKVISION_BUILD_EXAMPLES=ON \
            -DCKVISION_TEST_TEMP_ROOT="$TMPDIR/tests" \
            -DCKVISION_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: build
        script: |
          ccache --zero-stats >/dev/null
          python3 tools/ci/build_monitor.py --source . --build "$TMPDIR/build" \
            --executable "$TMPDIR/build/examples/ck-sysmon" --record "$TMPDIR/build-record.json" --jobs 4
          ccache --show-stats
      - name: test
        script: |
          ctest --test-dir "$TMPDIR/build" --output-on-failure --parallel 4 -LE pty
      - name: pty
        script: |
          # The timing-bound PTY contracts may take one retry, as in the
          # hosted CI lane.
          ctest --test-dir "$TMPDIR/build" --output-on-failure --parallel 4 -L pty --repeat until-pass:2
      - name: package
        script: |
          set -eu
          version=$(sed -nE 's/^project\(ckvision VERSION ([0-9.]+) LANGUAGES CXX\)$/\1/p' CMakeLists.txt)
          test -n "$version"
          case "${CKGIT_REF:-}" in refs/tags/*) test "${CKGIT_REF#refs/tags/}" = "v$version" ;; esac
          cpack -G 'TGZ;DEB;RPM' --config "$TMPDIR/build/CPackConfig.cmake" -B "$PWD/dist"
          for package in dist/*.tar.gz dist/*.deb dist/*.rpm; do
            python3 packaging/check_package.py --package "$package" --version "$version" \
              --scratch "$TMPDIR/check-$(basename "$package")"
          done
          (cd dist && sha256sum --strict -c ./*.sha256)
          cp "$TMPDIR/build-record.json" dist/linux-aarch64-build.json
      - name: docs
        script: |
          make --jobs=4 -C ../ck-git-hosting BUILD_ROOT="$TMPDIR" BUILD_DIR="$TMPDIR/ckdocs" client
          "$TMPDIR/ckdocs/bin/ckdocs" build --root "$PWD" --out "$PWD/public" --strict
    artifacts:
      name: packages
      paths: [dist]
pages:
  path: public
