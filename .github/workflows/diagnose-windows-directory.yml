name: Windows directory dialog diagnosis
on: workflow_dispatch
permissions:
  contents: read

jobs:
  directory-picker:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Build the optimized directory picker probe with symbols
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP ('ckvision-directory-diagnostic-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path "$work/tmp","$work/probe" | Out-Null
          foreach ($name in @('TEMP','TMP','TMPDIR')) {
            Set-Item -Path "Env:$name" -Value "$work/tmp"
          }
          $env:CKVISION_SOURCE = (Get-Location).Path
          @'
          cmake_minimum_required(VERSION 3.25)
          project(ckvision_directory_diagnosis LANGUAGES CXX)
          cmake_path(CONVERT "$ENV{CKVISION_SOURCE}" TO_CMAKE_PATH_LIST source NORMALIZE)
          add_compile_options(/Zi)
          set(CKVISION_BUILD_EXAMPLES OFF CACHE BOOL "")
          set(CKVISION_BUILD_TESTING OFF CACHE BOOL "")
          set(CKVISION_BUILD_TOOLS OFF CACHE BOOL "")
          add_subdirectory("${source}" ckvision)
          add_executable(directory_picker_probe "${source}/tests/main.cpp"
              "${source}/tests/test_directory_picker.cpp")
          target_link_libraries(directory_picker_probe PRIVATE ckvision::cvision)
          target_link_options(directory_picker_probe PRIVATE /DEBUG:FULL /OPT:REF /OPT:ICF /INCREMENTAL:NO)
          '@ | Set-Content -LiteralPath "$work/probe/CMakeLists.txt"
          cmake -S "$work/probe" -B "$work/build" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Configure failed' }
          cmake --build "$work/build" --config Release --target directory_picker_probe --parallel $env:NUMBER_OF_PROCESSORS
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          $probe = "$work/build/Release/directory_picker_probe.exe"
          $case = 'the_picker_builds_successfully_for_an_existing_root'
          & $probe --case $case
          $exitCode = $LASTEXITCODE
          if ($exitCode -eq 0) { exit 0 }
          $kits = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots').KitsRoot10
          $cdb = Join-Path $kits 'Debuggers\x64\cdb.exe'
          if (!(Test-Path -LiteralPath $cdb)) { throw "Directory picker exited $exitCode and cdb.exe is unavailable at $cdb" }
          & $cdb -G -lines -c 'sxe av; g; .exr -1; kv; q' $probe --case $case
          throw "Directory picker exited $exitCode"
