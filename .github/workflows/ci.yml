name: ci
on: [push, pull_request]

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        # The Linux lane names its runner and compiler instead of inheriting
        # an image default. GCC 13 (Ubuntu 24.04's system compiler, which
        # downstream Linux builds use) warns where the GCC 14 on the named
        # verification hosts does not -- its -Wdangling-reference heuristic
        # among them -- so the zero-warning gate must run it explicitly;
        # `ubuntu-latest` would silently move past it.
        include:
          - os: ubuntu-24.04
            compiler: -DCMAKE_CXX_COMPILER=g++-13
          - os: macos-26
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Use every runner core
        shell: bash
        run: echo "CMAKE_BUILD_PARALLEL_LEVEL=$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo "${NUMBER_OF_PROCESSORS:-4}")" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCKVISION_BUILD_EXAMPLES=ON ${{ matrix.compiler }}
      - name: Build
        run: cmake --build build --config Release
      - name: Test inventory
        run: ctest --test-dir build -C Release -V -R '^test_inventory$'
      - name: Test non-PTY hosted suite
        run: ctest --test-dir build -C Release --output-on-failure -LE pty
      - name: Test POSIX PTY contracts
        if: runner.os != 'Windows'
        run: ctest --test-dir build -C Release --output-on-failure -L pty --repeat until-pass:2
      - name: Test app-local modern ConPTY graphics
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/ci/test_conpty_modern.ps1 -BuildDir build
      - name: Test benchmark budget gate
        run: ctest --test-dir build -C Release --output-on-failure -L benchmark
      - name: Benchmark smoke
        run: cmake --build build --config Release --target bench_smoke_run
      - name: Sanitizer support matrix
        run: echo "Release lane only. Explicit sanitizer jobs cover ASan/UBSan on macOS and Ubuntu x64 and ARM64, and TSan on Ubuntu x64 and ARM64."

  shared:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: macos-26
          - os: windows-latest
            generator_arch: -A x64
          - os: windows-11-vs2026-arm
            generator_arch: -A ARM64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Use every runner core
        shell: bash
        run: echo "CMAKE_BUILD_PARALLEL_LEVEL=$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo "${NUMBER_OF_PROCESSORS:-4}")" >> "$GITHUB_ENV"
      - name: Configure shared library
        run: cmake -B build-shared -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DCKVISION_BUILD_EXAMPLES=ON ${{ matrix.generator_arch }}
      - name: Build shared library
        run: cmake --build build-shared --config Release
      - name: Test shared package install
        run: ctest --test-dir build-shared -C Release --output-on-failure -R '^install_package_smoke$'
      - name: Test shared unit suite
        run: ctest --test-dir build-shared -C Release -L unit --output-on-failure

  sanitize:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            sanitizer: address,undefined
          - os: ubuntu-24.04
            sanitizer: thread
          - os: ubuntu-24.04-arm
            sanitizer: address,undefined
            # Use compiler-rt on native ARM64 for ASan and UBSan. GCC's
            # instrumentation on this runner exceeded the directory suite budget.
            config_flags: '-DCMAKE_CXX_COMPILER=clang++-18 -DCMAKE_CXX_FLAGS_DEBUG="-g -O1"'
          - os: ubuntu-24.04-arm
            sanitizer: thread
          - os: macos-26
            sanitizer: address,undefined
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Use every runner core
        shell: bash
        run: echo "CMAKE_BUILD_PARALLEL_LEVEL=$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo "${NUMBER_OF_PROCESSORS:-4}")" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DCKVISION_SANITIZE=${{ matrix.sanitizer }} ${{ matrix.config_flags }}
      - name: Build
        run: cmake --build build
      - name: Test inventory
        env:
          CKVISION_SANITIZER: ${{ matrix.sanitizer }}
        run: ctest --test-dir build -V -R '^test_inventory$'
      - name: Test under ${{ matrix.sanitizer }} sanitizer
        run: |
          ctest --test-dir build --output-on-failure -LE pty
          ctest --test-dir build --output-on-failure -L pty --repeat until-pass:2
      - name: Unsupported sanitizer configurations
        run: echo "TSan is run on Ubuntu only; macOS and Windows sanitizer configurations are explicitly outside this CI lane."

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Use every runner core
        shell: bash
        run: echo "CMAKE_BUILD_PARALLEL_LEVEL=$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo "${NUMBER_OF_PROCESSORS:-4}")" >> "$GITHUB_ENV"
      - name: Configure Clang fuzzers with AddressSanitizer and UBSan
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++ -DCKVISION_BUILD_FUZZERS=ON -DCKVISION_SANITIZE=address,undefined
      - name: Build fuzz targets
        run: cmake --build build --target ckvision_fuzzers
      - name: Run bounded regression corpora
        run: ctest --test-dir build --output-on-failure -L fuzz-corpus
